services:
  surf:
    image: uncwlibrary/surf
    build: .
    container_name: surf
    platform: linux/amd64
    volumes:
      - ./app:/var/www/html/surf
    labels:
      - traefik.enable=true
      - traefik.http.routers.surf.entrypoints=websecure
      - traefik.http.routers.surf.rule=Host(`localhost`) && PathPrefix(`/surf`)
      - traefik.http.routers.surf.tls=true
      - traefik.http.routers.surf.priority=999
      - traefik.http.services.surf.loadbalancer.server.port=80
    restart: unless-stopped

networks:
  default:
    name: traefik_net
    external: true